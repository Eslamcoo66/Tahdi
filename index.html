<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي الشلة - كورة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--grass:#1f8a43;--grass2:#1a7c3b;--dark:#0e4d24;--line:#f4fff6;--ink:#fff;--gold:#ffd54f;--red:#ff5a4d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--grass:#14602f;--grass2:#115528;--dark:#083a1b}}
:root[data-theme="dark"]{--grass:#14602f;--grass2:#115528;--dark:#083a1b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:Tajawal,system-ui,sans-serif;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
 background:repeating-linear-gradient(90deg,var(--grass) 0 56px,var(--grass2) 56px 112px)}
header{background:var(--dark);border-bottom:3px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;min-height:66px;padding-top:env(safe-area-inset-top,0px);font-size:25px;font-weight:800}
#back{position:absolute;right:12px;bottom:12px;background:none;border:0;color:var(--ink);font-size:32px;line-height:1;cursor:pointer;display:none}
main{flex:1;overflow-y:auto;padding:18px 14px 28px;max-width:560px;width:100%;margin:0 auto}
.menu button{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:80px;margin:0 0 14px;background:var(--dark);color:var(--ink);border:3px solid var(--line);border-radius:16px;font:800 21px Tajawal,sans-serif;cursor:pointer}
.menu button i{font-style:normal;font-size:30px}
.menu button.soon{opacity:.6;border-style:dashed}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{background:var(--dark);color:#fff;border:3px solid var(--line);border-radius:14px;padding:11px 18px;font:800 18px Tajawal,sans-serif;cursor:pointer}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;justify-content:center;align-items:center;margin:12px 0;flex-wrap:wrap}
.status{text-align:center;font-size:22px;font-weight:800;min-height:34px;margin:6px 0 14px}
.board{background:var(--dark);border:3px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr;max-width:340px;margin:0 auto}
.xo button{aspect-ratio:1;background:var(--dark);border:3px solid var(--line);border-radius:14px;font-size:46px;color:#fff;cursor:pointer;padding:0}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;direction:ltr;background:var(--dark);border:3px solid var(--line);padding:8px;border-radius:14px;max-width:420px;margin:0 auto}
.c4 button{aspect-ratio:1;border-radius:50%;border:0;background:var(--grass);padding:0;cursor:pointer}
.c4 .r{background:var(--red)}.c4 .y{background:var(--gold)}
.card{background:var(--dark);border:3px solid var(--line);border-radius:22px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:32px;font-weight:800;padding:16px;margin:10px 0}
.card .lbl{font-size:16px;color:var(--gold);margin-bottom:6px}
.big{font-size:46px;font-weight:800;text-align:center}
.goal{position:relative;height:150px;border:3px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;margin:10px auto;max-width:360px;background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.18) 10px 11px);font-size:60px;display:flex;align-items:center;justify-content:center}
.dirs .btn{flex:1;min-width:90px}
.dots{font-size:26px;letter-spacing:4px;text-align:center;min-height:40px}
.sheet .p{display:flex;align-items:center;gap:8px;background:var(--dark);border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.sheet .p b{flex:1;font-size:19px}.sheet .p span{font-size:28px;font-weight:800;min-width:44px;text-align:center}
.sheet .p button{width:42px;height:42px;border-radius:50%;border:0;font-size:24px;font-weight:800;background:var(--gold);color:#222;cursor:pointer}
input{font:500 18px Tajawal,sans-serif;padding:12px;border-radius:12px;border:3px solid var(--line);background:var(--dark);color:#fff;flex:1;min-width:0}
input::placeholder{color:#b9dcc3}
.soonmsg{text-align:center;margin-top:40px;font-size:22px;font-weight:700}

:root{--panel:#f2fbf4;--ptext:#0e3d1f;--pline:#8fd0a5;--pfill:#e3f6e8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#0c3a1c;--ptext:#e6f7ea;--pline:#2f7d4a;--pfill:#0f4a24}}
:root[data-theme="dark"]{--panel:#0c3a1c;--ptext:#e6f7ea;--pline:#2f7d4a;--pfill:#0f4a24}
.panel{background:var(--panel);color:var(--ptext);border-radius:26px;padding:18px;margin-bottom:18px}
.trow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ttl{font-size:26px;font-weight:800}
.pill{background:var(--dark);color:#fff;border-radius:40px;padding:12px 28px;font-size:34px;font-weight:800;letter-spacing:3px;direction:ltr}
.panel .btn{background:var(--pfill);color:var(--ptext);border:2px solid var(--pline);flex:1}
.panel .btn.g{background:#43a047;color:#fff;border-color:#43a047}
.panel .btn:disabled{opacity:.45}
.chip{width:max-content;margin:6px auto;padding:6px 16px;border-radius:20px;background:var(--pfill);font-weight:700}
.chip.on{background:#c8f0d0}.chip.end{background:#ffd0cc;color:#7a1a12}
.note{text-align:center;font-weight:700;margin:6px 0 0}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.badge{background:var(--pfill);border:2px solid var(--pline);border-radius:20px;padding:6px 16px;font-weight:800}
.ic{width:52px;height:52px;border-radius:14px;background:#fb8c00;display:flex;align-items:center;justify-content:center;font-size:28px}
.h{border:2px solid var(--pline);background:var(--pfill);border-radius:14px;padding:14px;margin-bottom:10px;font-size:17px;font-weight:700;line-height:1.4}
.path{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0 16px}
.cl{background:var(--pfill);border:2px solid var(--pline);border-radius:12px;padding:8px 12px;font-weight:800}
.ar{font-size:22px;font-weight:800}
.ask{text-align:center;font-weight:800;font-size:18px;margin:6px 0}
.ans{background:var(--gold);color:#222;border-radius:14px;padding:14px;text-align:center;font-size:24px;font-weight:800;margin:6px 0 12px}
.row2{display:flex;gap:10px}.row2 .wide{flex:1}.row2 .rf{flex:0 0 64px;font-size:26px;padding:8px}
.btn.sel{background:var(--gold)!important;color:#222!important;border-color:var(--gold)!important}
.pcard{min-height:100px;font-size:28px}
.tm{margin-bottom:14px}.tm b{display:block;font-size:20px;margin-bottom:6px}
.res-box{background:var(--pfill);border:2px solid var(--pline);border-radius:16px;padding:12px;margin:10px 0;text-align:center}
</style>
</head>
<body>
<header><button id="back" aria-label="رجوع">&#8250;</button><span id="title">⚽ تحدي الشلة</span></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const sh=a=>[...a].sort(()=>Math.random()-.5);
let tm=null;
const GAMES=[
 ['⚽','إكس أو بالكورة',xo],['🥅','ضربات جزاء',pen],['🧢','أنا مين (تحدي صلب)',who],['🔁','الانتقالات',trans],['💰','المزايدة واللاعب المخفي',auction],['🔟','سمّي ١٠',topTen],
 ['🔴','كونكت فور',c4],['📋','سكور شيت',score],['🚩','أوفسايد'],['📸','مين في الصورة']
];
function home(){
  clearInterval(tm);$('#back').style.display='none';$('#title').textContent='⚽ تحدي الشلة';
  app.innerHTML='<div class="menu"></div>';
  GAMES.forEach(g=>{const b=document.createElement('button');if(!g[2])b.className='soon';
    b.innerHTML='<i>'+g[0]+'</i><span></span>';b.lastChild.textContent=g[1];b.onclick=()=>{
    $('#back').style.display='block';$('#title').textContent=g[1];
    g[2]?g[2]():app.innerHTML='<p class="soonmsg">اللعبة دي جاية قريب 🚧</p>'};app.firstChild.appendChild(b)});
}
$('#back').onclick=home;

function xo(){
  let b=Array(9).fill(''),t='⚽',over=false;
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  app.innerHTML='<div class="status" id="st">الدور على: ⚽</div><div class="xo" id="g"></div><div class="row"><button class="btn" id="rs">ماتش جديد</button></div>';
  const st=$('#st'),g=$('#g');
  function draw(){g.innerHTML='';b.forEach((v,i)=>{const c=document.createElement('button');c.textContent=v;c.setAttribute('aria-label','خانة '+(i+1));
    c.onclick=()=>{if(over||b[i])return;b[i]=t;
      if(L.some(l=>l.every(k=>b[k]===t))){over=true;st.textContent='🏆 الفايز: '+t}
      else if(b.every(Boolean)){over=true;st.textContent='تعادل 🤝'}
      else{t=t==='⚽'?'🥅':'⚽';st.textContent='الدور على: '+t}draw()};g.appendChild(c)})}
  $('#rs').onclick=xo;draw();
}

function pen(){
  const D=['شمال','وسط','يمين'],E=['⬅️','⬆️️','➡️'];let n=0,s=0,res=[];
  app.innerHTML='<div class="status" id="st">اختار هتشوط فين — 5 ضربات</div><div class="goal" id="gl">🧤</div><div class="dots" id="ds"></div><div class="row dirs" id="bt"></div><div class="row"><button class="btn" id="rs" style="display:none">ماتش جديد</button></div>';
  D.forEach((d,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=E[i]+' '+d;
    b.onclick=()=>{const k=Math.floor(Math.random()*3),goal=k!==i;n++;if(goal)s++;res.push(goal?'⚽':'❌');
      $('#gl').textContent=goal?'⚽ جووول':'🧤 الحارس صدّها';$('#ds').textContent=res.join(' ');
      if(n===5){$('#st').textContent='النتيجة: '+s+' من 5 '+(s>=4?'🔥':s>=3?'👏':'😅');$('#bt').style.display='none';$('#rs').style.display='inline-block'}
      else $('#st').textContent='الضربة '+(n+1)+' من 5'};$('#bt').appendChild(b)});
  $('#rs').onclick=pen;
}

function timerCard(onReset){
  let left=60,run=false;
  const el=document.createElement('div');el.className='panel';
  el.innerHTML='<div class="trow"><div class="ttl">⏱ المؤقت</div><div class="pill">1:00</div></div><div class="row"><button class="btn g" data-a="go">▶ بدء</button><button class="btn" data-a="ps" disabled>⏸ إيقاف</button><button class="btn" data-a="rs">↻ إعادة</button></div><div style="text-align:center"><span class="chip">متوقف</span></div><p class="note">تقدر تغير اللاعب مرة واحدة فقط</p>';
  const q=s=>el.querySelector(s),b=a=>q('[data-a='+a+']');
  function upd(){q('.pill').textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    const c=q('.chip');c.textContent=run?'شغال':left===0?'الوقت خلص':'متوقف';c.className='chip'+(run?' on':left===0?' end':'');
    b('go').disabled=run||left===0;b('ps').disabled=!run}
  b('go').onclick=()=>{run=true;upd();clearInterval(tm);tm=setInterval(()=>{left--;if(left<=0){left=0;run=false;clearInterval(tm)}upd()},1000)};
  b('ps').onclick=()=>{run=false;clearInterval(tm);upd()};
  b('rs').onclick=()=>{clearInterval(tm);run=false;left=60;upd();onReset()};
  return el;
}
const LS=k=>'tk_'+k;
function loadX(k,D){try{JSON.parse(localStorage.getItem(LS(k))||'[]').forEach(x=>{if(x&&x.n&&!D.some(d=>d.n===x.n))D.push(x)})}catch(e){}}
async function gen(k,D,msg,cnt){
  const sample=window.claude&&await claude.use('sample');
  if(!sample){msg('الإضافة التلقائية مش متاحة هنا');return}
  msg('⏳ Claude بيجهز لاعبين جداد بتلميحات صعبة…');
  const known=D.map(d=>d.n).join('، ');
  const rule='لعبة كورة بالعامية المصرية. هات ١٢ لاعب متنوعين (مصريين وعرب وأفارقة وأوروبيين ولاتينيين، أساطير وحاليين، ومش بس الأشهر) غير الأسماء دي: '+known+'. ';
  const q=k==='who'
   ? rule+'لكل لاعب: n الاسم بالعربي، h أربعة إلى خمسة تلميحات معقدة وصعبة جدًا بصيغة المتكلم (أنا...) متضمنة: أرقام قمصان غريبة لبستها، مواسم تاريخية محددة، حقائق أرقام وإحصائيات نادرة، أو أحداث صعبة في مسيرتي. متخليهاش سهلة أبدًا وممنوع ذكر اسم النادي الحالي أو الجنسية بشكل مباشر في التلميحات الأولى. اكتب بس معلومات متأكد منها ١٠٠٪. رجّع JSON array بس: [{"n":"..","h":[".."]}]'
   : rule+'لكل لاعب: n الاسم بالعربي، c مصفوفة أندية سينيور بالترتيب (٤ على الأقل، اكتب (إعارة) بعد الاسم لو إعارة). اكتب بس اللي إنت متأكد منه ١٠٠٪. رجّع JSON array بس: [{"n":"..","c":[".."]}]';
  try{
    const r=await sample.json(q),f=k==='who'?'h':'c';
    const add=(Array.isArray(r)?r:[]).filter(x=>x&&x.n&&Array.isArray(x[f])&&x[f].length>=(k==='who'?3:3)&&!D.some(d=>d.n===x.n));
    add.forEach(x=>D.push(x));
    try{const o=JSON.parse(localStorage.getItem(LS(k))||'[]');localStorage.setItem(LS(k),JSON.stringify(o.concat(add)))}catch(e){}
    msg('✅ اتضاف '+add.length+' لاعب جديد بتلميحات قوية');cnt();
  }catch(e){msg(e&&e.code==='not_granted'?'محتاج موافقتك عشان يضيف لاعبين':'حصلت مشكلة، جرب تاني')}
}
function quiz(D,body,ask,kind){
  if(kind)loadX(kind,D);
  const resets=[],seen=new Set();
  const next=()=>{let a=D.filter(x=>!seen.has(x.n));if(!a.length){seen.clear();a=D}const x=a[Math.floor(Math.random()*a.length)];seen.add(x.n);return x};
  app.innerHTML='';app.appendChild(timerCard(()=>resets.forEach(f=>f())));
  for(let n=1;n<=10;n++){
    let cur=next(),used=false;
    const c=document.createElement('div');c.className='panel';
    c.innerHTML='<div class="qh"><span class="badge">السؤال '+n+'</span><span class="ic">⚽</span></div><div class="qb"></div><div class="ans" hidden></div><div class="row2"><button class="btn wide sa">👁 إظهار الإجابة</button><button class="btn rf" aria-label="لاعب تاني">↻</button></div>';
    const qb=c.querySelector('.qb'),an=c.querySelector('.ans'),sa=c.querySelector('.sa'),rf=c.querySelector('.rf');
    const draw=()=>{qb.innerHTML=(ask?'<p class="ask">'+ask+'</p>':'')+body(cur);an.hidden=true;sa.textContent='👁 إظهار الإجابة'};
    sa.onclick=()=>{an.hidden=!an.hidden;an.textContent='الإجابة: '+cur.n;sa.textContent=an.hidden?'👁 إظهار الإجابة':'إخفاء الإجابة'};
    rf.onclick=()=>{if(used)return;used=true;rf.disabled=true;cur=next();draw()};
    resets.push(()=>{used=false;rf.disabled=false});
    draw();app.appendChild(c);
  }
  if(kind){const bx=document.createElement('div');bx.className='panel';
    bx.innerHTML='<div class="ttl" style="font-size:20px">🗄️ عدد اللاعبين في القاعدة: <span class="cnt"></span></div><p class="note msg"></p><button class="btn gen" style="width:100%">➕ ضيف ١٢ لاعب جديد بتلميحات صعبة (Claude)</button>';
    const cnt=()=>bx.querySelector('.cnt').textContent=D.length,msg=t=>bx.querySelector('.msg').textContent=t;
    cnt();bx.querySelector('.gen').onclick=()=>gen(kind,D,msg,cnt);app.appendChild(bx);
    if(D.length<20)gen(kind,D,msg,cnt);
  }
}

function who(){
  const D=[
   {n:'ليونيل ميسي',h:['سجلت أول هدف رسمي لي بقميص الفريق الأول بالتمريرة الحاسمة من رونالدينيو','حصلت على الكارت الأحمر الوحيد في مسيرتي الدولية الأولى بعد ٤٤ ثانية فقط من نزولي','لبست الرقم ٣٠ ثم الرقم ١٩ قبل الحصول على رقمي التاريخي','توجت بالكرة الذهبية وأنا بلعب في ٣ أندية مختلفة أو في انتقالات بينها']},
   {n:'كريستيانو رونالدو',h:['أول هدف لي في دوري أبطال أوروبا سجلته بعد ٢٦ مباراة في البطولة','ارتديت الرقم ٢٨ في بدايتي الاحترافية قبل الانتقال لإنجلترا','أنا اللاعب الوحيد الذي سجل في ٥ نسخ مختلفة من كأس العالم للرجال','سجلت أكثر من نصف أهدافي الدولية بعد سن الثلاثين']},
   {n:'محمد صلاح',h:['أول مباراة رسمية لي في إفريقيا كانت ضد نادي منصورة بالدوري المصري','سجلت ٤ أهداف (سوبر هاتريك) في مباراة واحدة بقميص منتخب مصر ضد جيبوتي في تصفيات مونديال 2026','ارتديت الرقم ٧٤ تكريمًا لشهداء الأهلي أثناء فترة إعارتي في إيطاليا','فزت بجائزة أفضل لاعب في السويسرا قبل الانتقال لإنجلترا']},
   {n:'كريم بنزيما',h:['ولدت في مدينة ليون ولعبت في فئاتها السنية الصغرى ورقم قميصي الأول كان ٢٠','أول هاتف اشتريته كان من مكافأة توقيعي مع النادي الكتالوني أو الملكي في سن المراهقة','صنعت أكثر من ١٦٥ هدفًا في الدوري الإسباني بجانب أهدافي الغزيرة','غيابي عن منتخب بلادي استمر لأكثر من ٥ سنوات كاملة لأسسباب انضباطية']},
   {n:'توماس مولر',h:['لقبت بنمطي الخاص بـ "مساحة المتر" أو مستكشف المساحات (Raumdeuter)','سجلت ٥ أهداف وصنعت ٣ في أول مشاركة لي بكأس العالم حاصلاً على الحذاء الذهبي بعمر ٢٠ سنة','خسرت نهائي دوري الأبطال في ملعبي وأنا صاحب هدف التقدم في المباراة','لعبت طوال مسيرتي الاحترافية لنادي واحد فقط في البوندسليجا']},
   {n:'أنطوان جريزمان',h:['تم رفضي من معظم أكاديميات بلدي في صغري بسبب بنيتي الجسدية الضعيفة','بدأت مسيرتي الاحترافية في إسبانيا وليس في فرنسا مع ريال سوسيداد','لعبت أكثر من ٨٤ مباراة متتالية مع منتخب فرنسا دون غياب عن أي مباراة رسمية أو ودية','عدت لنادي العاصمة الإسبانية برقم مختلف عن رقمي الشهير ٧']},
   {n:'رياض محرز',h:['بدأت في الهواة في نادي كيمبر الفرنسي قبل الانتقال للدرجة الثانية','انتقلت للدوري الإنجليزي بمبلغ زهيد جدًا لا يتعدى ٤٥٠ ألف يورو','سجلت ضربة حرة تاريخية في الدقيقة ٩٥ أهل بلدي لنهائي الكان ٢٠١٩','فزت بالدوري الإنجليزي مع فريقين مختلفين']},
   {n:'أنخيل دي ماريا',h:['سجلت هدف الفوز بالذهب أولمبياد ٢٠٠٨ وهدف الفوز بكوبا أمريكا ٢٠٢١ وهدف في نهائي مونديال ٢٠٢٢','انتقلت بين أكبر أندية إسبانيا، إنجلترا، فرنسا، وإيطاليا','بدأت مسيرتي في روزاريو سنترال وعُدت إليه في أواخر مسيرتي','نلت رجل مباراة نهائي دوري أبطال أوروبا ٢٠١٤ مع الفريق الملكي']},
   {n:'ألكسندر أكسلاد-تشامبرلين',h:['والدي كان لاعب كرة قدم دولي وشارك في كأس العالم 1990','كنت ثاني أصغر لاعب يمثل إنجلترا في بطولة يورو ٢٠١٢','سجلت هدفًا شهيرًا ضد مدريد/سيتي بتسديدة صاروخية من خارج المنطقة','فزت بالدوري الإنجليزي ودوري الأبطال مع الريدز رغم إصابتي بقطع بالرباط الصليبي']},
   {n:'نيمار',h:['سجلت هدفي رقم ١٠٠ في مسيرتي الاحترافية في يوم عيد ميلادي العشرين','حصلت على جائزة بوشكاش لأفضل هدف سنة ٢٠١١ وأنا بلعب في الدوري البرازيلي','خسرت نهائي دوري أبطال أوروبا بقميص النادي الباريسي في ٢٠٢٠','تسببت إصابتي بكسر الفقرة في أزمة كروية لبلادي في مونديال ٢٠١٤']},
   {n:'زلاتان إبراهيموفيتش',h:['سجلت أهدافًا رسمية في ٤ عقود زمنية مختلفة (التسعينات، ألفينات، الألفين وعشرة، والألفين وعشرين)','لعبت لأكبر ٣ أندية تنافسية في الدوري الإيطالي (يوفنتوس، إنتر، ميلان)','سجلت الهدف المئوي لنادي باريس سان جيرمان في البطولات الأوروبية','لعبت تحت قيادة جوارديولا، مورينيو، وأنشيلوتي']}
  ];
  quiz(D,x=>sh(x.h).map(t=>'<div class="h">💡 '+t+'</div>').join(''),'','who');
}

function auction(){
  const POS=['حارس مرمى','مدافع','وسط ملعب','جناح','مهاجم'];
  
  // كل جولة تحتوي على: [لاعب ظاهر المزايدة عليه, لاعب مخفي يحصل عليه الخاسر في المزايدة]
  const DB={
    eg:[
      [['محمد الشناوي','مصطفى شوبير'],['عصام الحضري','محمد أبو جبل'],['شريف إكرامي','أحمد الشناوي']],
      [['أحمد حجازي','محمد عبد المنعم'],['وائل جمعة','محمود حمدي الونش'],['أحمد فتحي','علي معلول']],
      [['إمام عاشور','عمرو السولية'],['محمد النني','طارق حامد'],['حسام غالي','عبد الله السعيد']],
      [['محمد صلاح','أحمد سيد زيزو'],['محمود تريزيجيه','رمضان صبحي'],['حسين الشحات','مصطفى فتحي']],
      [['عمر مرموش','مصطفى محمد'],['عمرو زكي','محمد زيدان'],['حسام حسن','أحمد حسام ميدو']]
    ],
    wd:[
      [['تيبو كورتوا','مانويل نوير'],['أليسون بيكر','إيدرسون'],['جانلويجي دوناروما','يان أوبلاك']],
      [['فيرجيل فان دايك','روبن دياز'],['أنطونيو روديجر','ماركينيوس'],['أشرف حكيمي','ويليام ساليبا']],
      [['كيفين دي بروين','جود بيلينجهام'],['رودري','فيديريكو فالفيردي'],['بيدري','مارتن أوديجارد']],
      [['فينيسيوس جونيور','لامين يامال'],['بوكايو ساكا','رافينيا'],['جمال موسيالا','فيل فودين']],
      [['كيليان مبابي','إيرلينج هالاند'],['هاري كين','روبرت ليفاندوفسكي'],['لاوتارو مارتينيز','فيكتور أوسيمين']]
    ]
  };
  
  const esc=x=>x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let names=[],mode='eg';
  
  function setup(){
    app.innerHTML='<div class="panel"><div class="ttl" style="margin-bottom:12px">💰 المزايدة واللاعب المخفي</div><p class="note" style="margin-bottom:12px;text-align:right">⚡ الفايز بالمزايدة بياخد <b>اللاعب الظاهر</b> بسعر مزايدته.<br>🎁 الطرف التاني بياخد <b>اللاعب المخفي</b> مجاناً!</p><div class="row" style="margin-top:0"><input id="nm" placeholder="اسم المتنافس (لاعبين)" style="background:var(--pfill);color:var(--ptext);border-color:var(--pline)"><button class="btn" id="ad" style="flex:0 0 auto">أضف</button></div><div class="path" id="ch"></div><div class="row"><button class="btn" data-m="eg">🇪🇬 مصري</button><button class="btn" data-m="wd">🌍 عالمي</button></div><button class="btn g" id="st" style="width:100%">ابدأ المزايدة (٢ لاعبين)</button></div>';
    const ch=$('#ch'),dr=()=>{ch.innerHTML=names.map(n=>'<span class="cl">'+esc(n)+'</span>').join('');app.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('sel',b.dataset.m===mode));$('#st').disabled=names.length!==2};
    const add=()=>{const v=$('#nm').value.trim();if(v&&names.length<2){names.push(v);$('#nm').value='';dr()}};
    $('#ad').onclick=add;$('#nm').onkeydown=e=>{if(e.key==='Enter')add()};
    app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;dr()});
    $('#st').onclick=play;dr();
  }

  function play(){
    // اختيار 5 جولات تنافسية
    const roundsData=DB[mode].map(posList=>posList[Math.floor(Math.random()*posList.length)]);
    const B=[100,100],T=[[],[]]; let r=0;

    function rnd(){
      const [visPlayer, hidPlayer]=roundsData[r];
      let price=0,lead=-1,step=5,sold=false;
      const pn=document.createElement('div');pn.className='panel';app.innerHTML='';app.appendChild(pn);

      function draw(){
        const winner = lead;
        const loser = lead === 0 ? 1 : 0;

        let msg = '';
        if(!sold){
          msg = lead < 0 ? 'ابدأ المزايدة على اللاعب الظاهر!' : 'أعلى سعر: '+price+'M من '+esc(names[lead]);
        }else{
          if(lead < 0){
            msg = 'محدش اشترى اللاعب الظاهر!';
          }else{
            msg = '🎉 مبروك لـ '+esc(names[winner])+' أخذ '+visPlayer+' بـ '+price+'M!<br>🎁 ومبروك لـ '+esc(names[loser])+' كسب اللاعب المخفي: <b>'+hidPlayer+'</b> مجانًا!';
          }
        }

        pn.innerHTML='<div class="qh"><span class="badge">الجولة '+(r+1)+' من 5</span><span class="badge">'+POS[r]+'</span></div>'
        +'<div class="card pcard"><span class="lbl">⚽ اللاعب الظاهر للمزايدة:</span>'+visPlayer+'</div>'
        +'<div class="card pcard" style="border-style:dashed;background:rgba(0,0,0,0.15)"><span class="lbl">🔒 اللاعب المخفي (للطرف التاني):</span>'+(sold?(lead>=0?hidPlayer:'لم يكشف'):'❓❓❓')+'</div>'
        +'<div class="ask">'+msg+'</div>'
        +(sold?'<button class="btn g" id="nx" style="width:100%;margin-top:12px">'+(r<4?'الجولة التالية':'عرض التشكيلات النهائية')+'</button>'
        :'<div class="row">'+[5,10,20].map(v=>'<button class="btn'+(v===step?' sel':'')+'" data-s="'+v+'">+'+v+'M</button>').join('')+'</div>'
        +'<div class="row">'+names.map((n,i)=>'<button class="btn" data-b="'+i+'" '+((B[i]<price+step||lead===i)?'disabled':'')+'>زود '+esc(n)+'<br><small>معاه '+B[i]+'M</small></button>').join('')+'</div>'
        +'<div class="row"><button class="btn g" id="sl" style="width:100%">'+(lead<0?'محدش عايز يزايد':'✅ إنهاء المزايدة والبيع')+'</button></div>');

        pn.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{step=+b.dataset.s;draw()});
        pn.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{lead=+b.dataset.b;price+=step;draw()});
        const sl=$('#sl');if(sl)sl.onclick=()=>{
          if(lead>=0){
            B[winner]-=price;
            T[winner].push({p:visPlayer,pos:POS[r],pr:price,type:'ظاهر'});
            T[loser].push({p:hidPlayer,pos:POS[r],pr:0,type:'مخفي (مجاني)'});
          }
          sold=true;draw();
        };
        const nx=$('#nx');if(nx)nx.onclick=()=>{r++;r<5?rnd():fin()};
      }
      draw();
    }

    function fin(){
      app.innerHTML='<div class="panel"><div class="ttl" style="margin-bottom:12px">🏁 التشكيلات والنتائج النهائية</div>'+names.map((n,i)=>'<div class="tm"><b>👤 '+esc(n)+' — باقي معاه '+B[i]+' مليون</b>'+(T[i].length?T[i].map(x=>'<div class="h"><b>'+x.pos+':</b> '+x.p+' <small>('+x.type+(x.pr?' بـ '+x.pr+'M':'')+')</small></div>').join(''):'<div class="h">لم يحصل على أي لاعب</div>')+'</div>').join('')+'<button class="btn g" id="ag" style="width:100%">مزايدة جديدة</button></div>';
      $('#ag').onclick=setup;
    }
    rnd();
  }
  setup();
}

function topTen(){
  const T=['أندية مصرية','لاعبين برازيليين','مدربين كبار','ملاعب كورة','منتخبات أفريقية','لاعبين اتلعبوا في ريال مدريد','أندية إنجليزية','حراس مرمى','أندية إيطالية','لاعبين مصريين'];
  const Lt=['أ','ب','ت','ج','ح','د','ر','س','ش','ع','ف','ك','م','ن','ه'];
  let deck=[],c=0,left=60;
  app.innerHTML='<div class="status">سمّي ١٠ في الفئة قبل ما الوقت يخلص</div><div class="big" id="tm">60</div><div class="card" id="cd">جاهز؟</div><div class="big" id="ct">0 / 10</div><div class="row"><button class="btn" id="go">ابدأ</button><button class="btn" id="pl" disabled>+١ إجابة صح</button><button class="btn" id="nx" disabled>فئة تانية</button></div>';
  const nx=()=>{if(!deck.length)deck=sh(T);c=0;$('#ct').textContent='0 / 10';$('#cd').textContent=deck.pop()+(Math.random()<.4?' — بحرف '+Lt[Math.floor(Math.random()*Lt.length)]:'')};
  const end=m=>{clearInterval(tm);$('#cd').textContent=m;$('#pl').disabled=$('#nx').disabled=true;$('#go').disabled=false;$('#go').textContent='جولة جديدة'};
  $('#go').onclick=()=>{left=60;$('#tm').textContent=left;nx();$('#pl').disabled=$('#nx').disabled=false;$('#go').disabled=true;
    tm=setInterval(()=>{left--;$('#tm').textContent=left;if(left<=0)end('الوقت خلص! عملت '+c+' من 10')},1000)};
  $('#pl').onclick=()=>{c++;$('#ct').textContent=c+' / 10';if(c>=10)end('🏆 كملت الـ10!')};
  $('#nx').onclick=nx;
}

function c4(){
  const R=6,C=7;let b=Array.from({length:R},()=>Array(C).fill('')),t='r',over=false;const nm={r:'الأحمر',y:'الأصفر'};
  app.innerHTML='<div class="status" id="st">الدور على الأحمر</div><div class="c4" id="g"></div><div class="row"><button class="btn" id="rs">ماتش جديد</button></div>';
  const st=$('#st'),g=$('#g');
  const win=(r,c)=>[[0,1],[1,0],[1,1],[1,-1]].some(([dr,dc])=>{let n=1;for(const s of[1,-1]){let i=r+dr*s,j=c+dc*s;while(b[i]&&b[i][j]===t){n++;i+=dr*s;j+=dc*s}}return n>=4});
  function draw(){g.innerHTML='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){const x=document.createElement('button');x.className=b[r][c];x.setAttribute('aria-label','عمود '+(c+1));
    x.onclick=()=>{if(over)return;let i=R-1;while(i>=0&&b[i][c])i--;if(i<0)return;b[i][c]=t;
      if(win(i,c)){over=true;st.textContent='🏆 فاز '+nm[t]}else if(b[0].every(Boolean)){over=true;st.textContent='تعادل 🤝'}
      else{t=t==='r'?'y':'r';st.textContent='الدور على '+nm[t]}draw()};g.appendChild(x)}}
  $('#rs').onclick=c4;draw();
}

function score(){
  let P=[];
  app.innerHTML='<div class="row" style="margin-top:0"><input id="nm" placeholder="اسم الفريق أو اللاعب"><button class="btn" id="ad">أضف</button></div><div class="sheet" id="ls"></div><div class="row"><button class="btn" id="z">صفّر النتيجة</button></div>';
  const ls=$('#ls');
  function draw(){ls.innerHTML='';P.forEach(p=>{const d=document.createElement('div');d.className='p';
    d.innerHTML='<b></b><button aria-label="زود">+</button><span>'+p.s+'</span><button aria-label="نقّص">&minus;</button>';
    d.firstChild.textContent=p.n;const bs=d.querySelectorAll('button');bs[0].onclick=()=>{p.s++;draw()};bs[1].onclick=()=>{p.s--;draw()};ls.appendChild(d)})}
  const add=()=>{const v=$('#nm').value.trim();if(!v)return;P.push({n:v,s:0});$('#nm').value='';draw()};
  $('#ad').onclick=add;$('#nm').onkeydown=e=>{if(e.key==='Enter')add()};$('#z').onclick=()=>{P.forEach(p=>p.s=0);draw()};
}
home();
